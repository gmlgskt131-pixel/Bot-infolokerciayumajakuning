- name: Jalankan Script Loker
  env:
  BOT_TOKEN: ${{ 8883789126:AAFWOh2bW2-ch1in3GEDK04GSxdBKPhn6tw }}
    CHAT_ID: ${{ -1004426208468 }}
  run: python fetch_loker.py
on:
  workflow_dispatch:

  schedule:
    # Jam 00:00, 06:00, dan 12:00 WIB
    - cron: "0 0,6,12 * * *"
      timezone: "Asia/Jakarta"
      
# Mencegah dua bot berjalan bersamaan
concurrency:
  group: auto-loker-bot
  cancel-in-progress: false


jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Dibutuhkan agar GitHub Actions bisa commit sent.json
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
     - name: Jalankan Script Loker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python fetch_loker.py
      
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kirim Pesan Telegram
        env:
          BOT_TOKEN: ${{ 8883789126:AAFWOh2bW2-ch1in3GEDK04GSxdBKPhn6tw }}
          TELEGRAM_CHAT_ID: "@-1004426208468" # Atau dari ${{ secrets.CHAT_ID }}
        run: python pesan_terjadwal.py

      - name: Simpan Database Anti-Duplikat
        if: always()
        run: |
          if [ ! -f sent.json ]; then
            echo "sent.json tidak ditemukan."
            exit 0
          fi
          
           git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada sent.json."
          else
            git commit -m "Auto-update sent.json [skip ci]"
            git push
          fi
