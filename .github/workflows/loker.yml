name: Telegram Test

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Kirim pesan ke Telegram
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=@infolokerciayumajakuning" \
            -d "text=GitHub Actions berhasil terhubung!")
          echo "Hasil Respon Telegram:"
          echo "$RESPONSE"
