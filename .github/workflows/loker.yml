name: Auto Multi-Source Loker Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,6,11 * * *' # Otomatis jalan jam 08.00, 13.00, dan 18.00 WIB

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Jalankan Script Loker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "@infolokerciayumajakuning" # Ganti dengan username/ID channel Anda
        run: python fetch_loker.py

      - name: Commit Riwayat Pesan
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add sent_posts.json || true
          git commit -m "Update sent posts history [skip ci]" || true
          git push
          
